name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the workflow publish to Pages using the built-in GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a queued one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `enablement: true` turns Pages on for the repo if it is not already,
      # so no manual settings change is needed for the first deploy.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The game is plain HTML/CSS/ES modules — the repo is the site, no build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
